<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .b1 { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 32px; fill: rgba(255,255,255,0.06); text-transform: uppercase; letter-spacing: 2px; }
    .b2 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 40px; fill: rgba(255,255,255,0.05); font-style: italic; }
    .b3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 36px; fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1.5px; text-transform: uppercase; }
    .b4 { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 28px; fill: rgba(255,255,255,0.07); letter-spacing: 4px; text-transform: uppercase; }
  </style>
  
  <!-- Row 1 -->
  <text x="40" y="80" class="b1">NIKE</text>
  <text x="250" y="80" class="b3">ADIDAS</text>
  <text x="550" y="80" class="b2">Lacoste</text>
  <text x="800" y="80" class="b4">RALPH LAUREN</text>
  
  <!-- Row 2 -->
  <text x="-20" y="200" class="b2">Tommy Hilfiger</text>
  <text x="350" y="200" class="b1">DIESEL</text>
  <text x="600" y="200" class="b3">DICKIES</text>
  <text x="850" y="200" class="b1">PAUL SMITH</text>
  
  <!-- Row 3 -->
  <text x="80" y="320" class="b4">LEVI'S</text>
  <text x="300" y="320" class="b2">Kappa</text>
  <text x="500" y="320" class="b1">CHAMPION</text>
  <text x="820" y="320" class="b3">BARBOUR</text>
  
  <!-- Row 4 -->
  <text x="10" y="440" class="b3">FRED PERRY</text>
  <text x="350" y="440" class="b4">COLUMBIA</text>
  <text x="650" y="440" class="b1">NIKE</text>
  <text x="850" y="440" class="b2">Adidas</text>
</svg>
